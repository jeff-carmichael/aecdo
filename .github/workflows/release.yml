name: Release

on:
  push:
    tags: ["v*"]
  # Run it by hand (Actions → Release → Run workflow) to build and smoke-test every binary without
  # publishing; the binaries are kept as the run's artifacts.
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: linux-x64,    runner: ubuntu-latest, smoke: true }
          - { target: linux-arm64,  runner: ubuntu-latest, smoke: false }
          # Built on Windows: Bun can only give the exe its icon and details there.
          - { target: windows-x64,  runner: windows-latest, smoke: true, exe: aecdo.exe }
          # macOS binaries are built on macOS so they can be codesigned (required on Apple Silicon).
          - { target: darwin-arm64, runner: macos-latest,  smoke: true }
          - { target: darwin-x64,   runner: macos-latest,  smoke: false }
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version v$PKG_VERSION"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Compile binary
        if: "!startsWith(matrix.target, 'windows-')"
        run: bun run build:bin:${{ matrix.target }}

      - name: Compile binary (Windows, with icon and file details)
        if: startsWith(matrix.target, 'windows-')
        run: |
          VERSION=$(node -p "require('./package.json').version.split('-')[0]")
          bun run build:bin:${{ matrix.target }} \
            --windows-icon=cli/gui/icon.ico \
            --windows-title=aecdo \
            --windows-publisher=AECDO \
            --windows-description="AEC Drawing Ontology app and CLI" \
            --windows-version="$VERSION.0"

      - name: Codesign (macOS)
        if: startsWith(matrix.target, 'darwin-')
        run: codesign --force --sign - dist-bin/${{ matrix.target }}/aecdo

      - name: Smoke test
        if: matrix.smoke
        run: |
          BIN=dist-bin/${{ matrix.target }}/${{ matrix.exe || 'aecdo' }}
          "$BIN" --version
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/$BIN" validate "$GITHUB_WORKSPACE/examples/sample-drawing-package-1and2family.jsonld"

      - name: Package
        run: |
          TARGET=${{ matrix.target }}
          STAGE="$RUNNER_TEMP/aecdo-$TARGET"
          mkdir -p "$STAGE" out
          cp dist-bin/$TARGET/* LICENSE README.md "$STAGE/"
          if [ "${TARGET#windows-}" != "$TARGET" ]; then
            pwsh -NoProfile -Command "Compress-Archive -Path '$STAGE/*' -DestinationPath 'out/aecdo-$TARGET.zip' -CompressionLevel Optimal"
          else
            tar -C "$STAGE" -czf "out/aecdo-$TARGET.tar.gz" .
          fi
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: aecdo-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: out
          pattern: aecdo-*
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: out
        run: |
          sha256sum aecdo-* > checksums.txt
          cat checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS="--verify-tag --generate-notes --title $GITHUB_REF_NAME"
          case "$GITHUB_REF_NAME" in *-*) FLAGS="$FLAGS --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $FLAGS out/*
