title: AECDO Guide
description: Install the free aecdo app to look through, check, mark up, and ask an AI assistant about data from construction drawings.
repository: jeff-carmichael/aecdo

# Shows the "DrawingBot API isn't available yet" notice on every page.
# Set to false once the API launches.
api_notice: true
baseurl: /aecdo
url: https://jeff-carmichael.github.io

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    disable: true

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default

nav:
  - title: Getting started
    url: /
  - title: Install and update
    url: /install.html
  - title: Use the app
    url: /app.html
  - title: AI assistant
    url: /assistant.html
  - title: Mark up the PDF
    url: /markups.html
  - title: Demo walkthrough
    url: /demo.html
  - title: Troubleshooting
    url: /troubleshooting.html
  - title: Data model and bbox
    url: /data-model.html
    minor: true
  - title: Command line and agents
    url: /agents.html
    minor: true
