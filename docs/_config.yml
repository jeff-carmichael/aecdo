title: AECDO Guide
description: Install the open-source aecdo CLI and explore, check, and ask an AI assistant about structured data from construction drawings.
repository: jeff-carmichael/aecdo

# Shows the "DrawingBot API isn't available yet" notice on every page.
# Set to false once the API launches.
api_notice: true
baseurl: /aecdo
url: https://jeff-carmichael.github.io

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    disable: true

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default

nav:
  - title: Getting started
    url: /
  - title: Install and update
    url: /install.html
  - title: Explore a drawing set
    url: /explore.html
  - title: AI assistant
    url: /assistant.html
  - title: Demo walkthrough
    url: /demo.html
  - title: Data model and bbox
    url: /data-model.html
  - title: Claude Code and agents
    url: /agents.html
  - title: Process PDFs (soon)
    url: /process.html
  - title: Troubleshooting
    url: /troubleshooting.html
